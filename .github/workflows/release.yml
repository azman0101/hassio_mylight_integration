name: Release assets

on:
  release:
    types: [published]

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout the released tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - name: Build deterministic release assets
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python3 scripts/build_release.py "$RELEASE_TAG"
      - name: Attest release assets
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            dist/mylight_systems.zip
            dist/mylight_systems.spdx.json
            dist/SHA256SUMS
      - name: Upload immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/mylight_systems.zip dist/mylight_systems.spdx.json dist/SHA256SUMS
